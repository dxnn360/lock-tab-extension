<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabLock</title>
  <link rel="stylesheet" href="../tailwind.css">
</head>
<body class="w-[320px] m-0 bg-black text-white font-sans overflow-hidden">
  <div class="flex flex-col p-4 w-full box-border h-[420px]">
    <header class="flex items-center justify-between pb-3 mb-4 border-b border-gray-800">
      <div class="flex items-center space-x-2">
        <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span class="text-sm font-bold tracking-widest uppercase">TABLOCK</span>
      </div>
      <div class="flex items-center space-x-1.5 px-2 py-1 bg-gray-900 border border-gray-800 rounded-full">
        <span class="w-1.5 h-1.5 bg-green-500 rounded-full shadow-[0_0_5px_#22c55e]"></span>
        <span class="text-[9px] font-bold text-gray-300 tracking-wider">READY</span>
      </div>
    </header>

    <!-- State 1: Setup Password -->
    <div id="setup-view" class="flex-1 flex flex-col hidden animate-slide-up">
      <div class="mb-5 text-center">
        <h2 class="text-lg font-semibold mb-1">Set Password</h2>
        <p class="text-xs text-gray-400">Create a master password to secure your tabs.</p>
      </div>
      <form id="setup-form" class="flex flex-col space-y-4">
        <div class="flex flex-col">
          <label for="new-password" class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-1.5">New Password</label>
          <input type="password" id="new-password" placeholder="At least 4 characters" required autocomplete="new-password" class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-md px-3 py-2 outline-none focus:border-white focus:ring-1 focus:ring-white transition-all placeholder:text-gray-500">
        </div>
        <div class="flex flex-col">
          <label for="confirm-password" class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Repeat password" required autocomplete="new-password" class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-md px-3 py-2 outline-none focus:border-white focus:ring-1 focus:ring-white transition-all placeholder:text-gray-500">
        </div>
        <button type="submit" class="w-full bg-white text-black font-semibold text-sm rounded-md py-2.5 mt-2 hover:bg-gray-200 hover:-translate-y-0.5 active:translate-y-0 active:scale-95 transition-all border-none cursor-pointer shadow-lg shadow-white/10">Save Password</button>
      </form>
    </div>

    <!-- State 2: Main Dashboard -->
    <div id="main-view" class="flex-1 flex flex-col hidden animate-slide-up">
      <div class="bg-gray-900 border border-gray-800 rounded-lg p-3.5 mb-4 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-24 h-24 bg-white/5 blur-2xl rounded-full pointer-events-none -mr-12 -mt-12 animate-pulse-glow"></div>
        <div class="relative z-10 flex flex-col">
          <span class="text-[9px] font-bold text-gray-500 tracking-wider mb-1">CURRENT TAB</span>
          <h3 class="text-sm font-semibold whitespace-nowrap overflow-hidden text-ellipsis mb-0.5" id="current-tab-title">Loading...</h3>
          <p class="text-xs text-gray-400 whitespace-nowrap overflow-hidden text-ellipsis" id="current-tab-url">...</p>
        </div>
        <button id="btn-lock-current" class="w-full bg-white text-black font-semibold text-sm rounded-md py-2 mt-3 hover:bg-gray-200 hover:-translate-y-0.5 active:translate-y-0 active:scale-95 transition-all border-none cursor-pointer relative z-10 shadow-lg shadow-white/10">
          Lock This Tab
        </button>
      </div>

      <div class="bg-black border border-gray-800 rounded-lg p-3.5 mb-4">
        <div class="flex items-center justify-between">
          <div class="flex flex-col">
            <span class="text-sm font-semibold">Auto-Lock on Leave</span>
            <span class="text-[10px] text-gray-400">Lock tab after idle inactivity</span>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="toggle-autolock" class="sr-only peer">
            <div class="w-9 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-green-500"></div>
          </label>
        </div>

        <div id="autolock-timer-row" class="flex items-center justify-between mt-3 pt-3 border-t border-gray-800 hidden">
          <span class="text-xs text-gray-400">Idle timeout:</span>
          <select id="select-autolock-time" class="bg-gray-900 border border-gray-700 text-white text-xs rounded-md px-2 py-1 outline-none focus:border-white cursor-pointer appearance-none pr-6 bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20width%3D%2210%22%20height%3D%225%22%20viewBox%3D%220%200%2010%205%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M0%200L5%205L10%200H0Z%22%20fill%3D%22%23888888%22%2F%3E%3C%2Fsvg%3E')] bg-no-repeat bg-[position:right_8px_center]">
            <option value="1">1 Minute</option>
            <option value="5" selected>5 Minutes</option>
            <option value="10">10 Minutes</option>
            <option value="15">15 Minutes</option>
            <option value="30">30 Minutes</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 mb-auto">
        <div class="flex flex-col items-center justify-center bg-gray-900 border border-gray-800 rounded-lg p-2.5">
          <span class="text-xl font-bold text-white mb-0.5" id="locked-count">0</span>
          <span class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold">Locked</span>
        </div>
        <div class="flex flex-col items-center justify-center bg-gray-900 border border-gray-800 rounded-lg p-2.5">
          <span class="text-xl font-bold text-white mb-0.5" id="autolock-count">0</span>
          <span class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold">Auto-Lock</span>
        </div>
      </div>

      <div class="mt-4 pt-3 border-t border-gray-800 flex justify-center">
        <button id="btn-change-password" class="text-xs text-gray-400 hover:text-white active:scale-95 transition-all bg-transparent border-none cursor-pointer p-1">Change Password</button>
      </div>
    </div>

    <!-- State 3: Change Password -->
    <div id="change-pwd-view" class="flex-1 flex flex-col hidden animate-slide-up">
      <div class="mb-5 text-center">
        <h2 class="text-lg font-semibold mb-1">Change Password</h2>
      </div>
      <form id="change-pwd-form" class="flex flex-col space-y-4">
        <div class="flex flex-col">
          <label for="old-password" class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Current Password</label>
          <input type="password" id="old-password" required placeholder="••••••••" class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-md px-3 py-2 outline-none focus:border-white focus:ring-1 focus:ring-white transition-all placeholder:text-gray-500">
        </div>
        <div class="flex flex-col">
          <label for="update-password" class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-1.5">New Password</label>
          <input type="password" id="update-password" required placeholder="••••••••" class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-md px-3 py-2 outline-none focus:border-white focus:ring-1 focus:ring-white transition-all placeholder:text-gray-500">
        </div>
        <div class="flex items-center space-x-3 mt-2 pt-2">
          <button type="button" id="btn-cancel-change" class="flex-1 bg-transparent border border-gray-700 text-white font-semibold text-sm rounded-md py-2 hover:bg-gray-800 active:scale-95 transition-all cursor-pointer">Cancel</button>
          <button type="submit" class="flex-1 bg-white text-black font-semibold text-sm rounded-md py-2 hover:bg-gray-200 hover:-translate-y-0.5 active:translate-y-0 active:scale-95 transition-all border-none cursor-pointer shadow-lg shadow-white/10">Update</button>
        </div>
      </form>
    </div>

    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-gray-800 border border-gray-700 text-white text-xs px-4 py-2 rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
