<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabLock</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <svg class="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span class="logo-text">TABLOCK</span>
      </div>
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span class="status-label">READY</span>
      </div>
    </header>

    <!-- State 1: Setup Password -->
    <div id="setup-view" class="view hidden">
      <div class="section-desc">
        <h2>Set Password</h2>
        <p>Create a master password to secure your tabs.</p>
      </div>
      <form id="setup-form">
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" placeholder="At least 4 characters" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Repeat password" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary">Save Password</button>
      </form>
    </div>

    <!-- State 2: Main Dashboard -->
    <div id="main-view" class="view hidden">
      <div class="tab-target-card">
        <div class="tab-meta">
          <span class="meta-label">CURRENT TAB</span>
          <h3 class="tab-title" id="current-tab-title">Loading...</h3>
          <p class="tab-url" id="current-tab-url">...</p>
        </div>
        <button id="btn-lock-current" class="btn btn-primary btn-action">
          Lock This Tab
        </button>
      </div>

      <div class="setting-box">
        <div class="setting-header">
          <div class="setting-title-group">
            <span class="setting-title">Auto-Lock on Leave</span>
            <span class="setting-sub">Lock tab after idle inactivity</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggle-autolock">
            <span class="slider"></span>
          </label>
        </div>

        <div id="autolock-timer-row" class="timer-config hidden">
          <span class="timer-label">Idle timeout:</span>
          <select id="select-autolock-time" class="clean-select">
            <option value="1">1 Minute</option>
            <option value="5" selected>5 Minutes</option>
            <option value="10">10 Minutes</option>
            <option value="15">15 Minutes</option>
            <option value="30">30 Minutes</option>
          </select>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-cell">
          <span class="stat-number" id="locked-count">0</span>
          <span class="stat-name">Locked</span>
        </div>
        <div class="stat-cell">
          <span class="stat-number" id="autolock-count">0</span>
          <span class="stat-name">Auto-Lock</span>
        </div>
      </div>

      <div class="bottom-bar">
        <button id="btn-change-password" class="btn btn-outline">Change Password</button>
      </div>
    </div>

    <!-- State 3: Change Password -->
    <div id="change-pwd-view" class="view hidden">
      <div class="section-desc">
        <h2>Change Password</h2>
      </div>
      <form id="change-pwd-form">
        <div class="form-group">
          <label for="old-password">Current Password</label>
          <input type="password" id="old-password" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="update-password">New Password</label>
          <input type="password" id="update-password" required placeholder="••••••••">
        </div>
        <div class="btn-group">
          <button type="button" id="btn-cancel-change" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-primary">Update</button>
        </div>
      </form>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
