<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locked Tab - TabLock</title>
  <link rel="stylesheet" href="../tailwind.css">
</head>
<body class="flex items-center justify-center min-h-screen bg-black text-white m-0 font-sans">
  <div class="flex flex-col items-center justify-center w-full max-w-sm p-8 bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl relative overflow-hidden animate-slide-up">
    <!-- Glow effect behind modal -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-1/2 bg-white/5 blur-[80px] rounded-full pointer-events-none animate-pulse-glow"></div>

    <div class="relative w-full z-10 flex flex-col items-center">
      <div class="flex items-center justify-center w-16 h-16 bg-gray-800 border border-gray-700 rounded-full mb-6 text-white shadow-[0_0_15px_rgba(255,255,255,0.1)]">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold tracking-widest uppercase mb-2">LOCKED TAB</h1>
        <p class="text-sm text-gray-400">Enter your master password to unlock this session.</p>
      </div>

      <div class="inline-flex items-center space-x-2 bg-gray-800 border border-gray-700 px-3 py-1.5 rounded-full mb-8">
        <span class="text-[10px] font-bold text-gray-400 tracking-wider">ENCRYPTION</span>
        <span class="text-xs font-semibold text-white">AES-256-GCM PROTECTED</span>
      </div>

      <form id="unlock-form" class="w-full flex flex-col space-y-4">
        <div class="relative flex items-center w-full">
          <input 
            type="password" 
            id="password-input" 
            placeholder="Master password..." 
            class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-lg px-4 py-3 outline-none focus:border-white focus:ring-1 focus:ring-white transition-all placeholder:text-gray-500 pr-12"
            autofocus 
            autocomplete="off"
            required
          >
          <button type="submit" id="btn-unlock" class="absolute right-2 p-1.5 text-gray-400 hover:text-white hover:scale-110 active:scale-95 transition-all bg-transparent border-none cursor-pointer flex items-center justify-center outline-none" aria-label="Unlock">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
        <p id="error-msg" class="text-xs text-red-400 text-center hidden">Incorrect password. Please try again.</p>
      </form>

      <div class="mt-8 text-[10px] font-bold tracking-widest text-gray-500">
        <span>ZERO-KNOWLEDGE PRIVACY</span>
      </div>
    </div>
  </div>

  <script src="lock.js"></script>
</body>
</html>
