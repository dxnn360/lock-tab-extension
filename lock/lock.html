<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locked Tab - TabLock</title>
  <link rel="stylesheet" href="lock.css">
</head>
<body>
  <div class="lock-container">
    <div class="lock-modal">
      <div class="lock-icon-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <div class="lock-header">
        <h1 class="modal-title">LOCKED TAB</h1>
        <p class="modal-sub">Enter your master password to unlock this tab.</p>
      </div>

      <div class="target-site-badge">
        <span class="site-label">TARGET</span>
        <span class="site-title" id="locked-tab-title">Loading...</span>
      </div>

      <form id="unlock-form" class="unlock-form">
        <div class="input-container">
          <input 
            type="password" 
            id="password-input" 
            placeholder="Password..." 
            autofocus 
            autocomplete="off"
            required
          >
          <button type="submit" id="btn-unlock" class="btn-unlock" aria-label="Unlock">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
        <p id="error-msg" class="error-text hidden">Incorrect password. Please try again.</p>
      </form>

      <div class="modal-footer">
        <span>TABLOCK SECURITY</span>
      </div>
    </div>
  </div>

  <script src="lock.js"></script>
</body>
</html>
